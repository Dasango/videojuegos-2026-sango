name: Web (GitHub Pages)

on:
  push:
    branches: [web-pages]
    paths:
      - "labs/s06_sumativa_i/web/dist/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: labs/s06_sumativa_i/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
