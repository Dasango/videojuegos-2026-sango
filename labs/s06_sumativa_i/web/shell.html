<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Evaluacion Sumativa I - jugable en el navegador y en celular con WebAssembly.">
<title>Evaluacion Sumativa I</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0c1c10;
    color: #e8f5e9;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  h1 { font-size: 1.2rem; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
  #app { position: relative; line-height: 0; width: min(960px, 100%); }
  canvas#canvas {
    display: block;
    background: #0c1c10;
    border: 2px solid #2e5d3a;
    border-radius: 6px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 100%;
    height: auto;
    aspect-ratio: 960 / 600;
    outline: none;
    touch-action: none;
  }
  #status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(12, 28, 16, 0.85);
    font-size: 1rem;
    border-radius: 6px;
    line-height: 1.4;
    text-align: center;
    padding: 12px;
  }
  #status[hidden] { display: none; }
  #controles {
    font-size: 0.85rem;
    color: #a8c5ad;
    text-align: center;
    max-width: 960px;
    line-height: 1.5;
  }
  #controles kbd {
    background: #1e3a26;
    border: 1px solid #2e5d3a;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    color: #e8f5e9;
  }

  /* ---------- Controles tactiles (solo celular, encima del juego) ---------- */
  #touch { display: none; line-height: normal; }
  #girar { display: none; }

  .zona {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    touch-action: none;
  }
  #zona-izq { left: 0; }
  #zona-der { right: 0; }

  /* Guia muy tenue, visible solo cuando no hay dedo */
  .guia {
    position: absolute;
    bottom: 16%;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 1px dashed rgba(255, 255, 255, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: rgba(255, 255, 255, 0.2);
    pointer-events: none;
  }
  #zona-izq .guia { left: 14%; }
  #zona-der .guia { right: 14%; }
  .zona.activo .guia { display: none; }

  .base {
    position: absolute;
    width: 110px;
    height: 110px;
    margin: -55px 0 0 -55px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.07);
    display: none;
    pointer-events: none;
  }
  .zona.activo .base { display: block; }
  .knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 48px;
    height: 48px;
    margin: -24px 0 0 -24px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.38);
    pointer-events: none;
  }

  #botones {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 6;
  }
  .tbtn {
    -webkit-appearance: none;
    appearance: none;
    min-width: 52px;
    height: 34px;
    background: rgba(46, 93, 58, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 10px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 0.85rem;
    font-weight: 600;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  .tbtn:active, .tbtn.activo { background: rgba(111, 207, 151, 0.9); color: #0c1c10; }

  @media (pointer: coarse) {
    #controles, h1 { display: none; }
    body { padding: 0; gap: 0; height: 100vh; height: 100dvh; overflow: hidden; }
    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#canvas {
      width: min(100vw, calc(100dvh * 1.6));
      height: auto;
      border: none;
      border-radius: 0;
    }
    #touch { display: block; position: fixed; inset: 0; z-index: 5; }
  }

  /* Pide girar el celular si esta vertical */
  @media (pointer: coarse) and (orientation: portrait) {
    #girar {
      display: flex;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #0c1c10;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      text-align: center;
      padding: 24px;
      font-size: 1.1rem;
      line-height: 1.4;
    }
    #girar .icono { font-size: 3rem; transform: rotate(90deg); }
  }
</style>
</head>
<body>
<h1>Evaluaci&oacute;n Sumativa I</h1>

<div id="app">
  <canvas id="canvas" width="960" height="600" tabindex="0"
          oncontextmenu="event.preventDefault()" aria-label="Area de juego"></canvas>
  <div id="status">Cargando juego&hellip;</div>
</div>

<div id="touch" aria-label="Controles tactiles">
  <!-- Izquierda: avanzar / retroceder (W / S) -->
  <div class="zona" id="zona-izq" aria-label="Mando para avanzar">
    <div class="guia">&#9650;&#9660;</div>
    <div class="base"><div class="knob"></div></div>
  </div>
  <!-- Derecha: apuntar / girar (A / D) -->
  <div class="zona" id="zona-der" aria-label="Mando para apuntar">
    <div class="guia">&#9664;&#9654;</div>
    <div class="base"><div class="knob"></div></div>
  </div>
  <div id="botones">
    <button class="tbtn" type="button" data-key="Enter" data-code="Enter" data-keycode="13" aria-label="Menu / aceptar">OK</button>
    <button class="tbtn" type="button" data-key="p" data-code="KeyP" data-keycode="80" aria-label="Pausa">&#10073;&#10073;</button>
  </div>
</div>

<div id="girar">
  <div class="icono">&#128241;</div>
  <div>Gira tu celular<br>a horizontal para jugar</div>
</div>

<div id="controles">
  <kbd>W</kbd>/<kbd>S</kbd> avanzar/retroceder &middot;
  <kbd>A</kbd>/<kbd>D</kbd> girar &middot;
  <kbd>Espacio</kbd> saltar &middot;
  <kbd>Enter</kbd>/<kbd>Espacio</kbd> men&uacute; &middot;
  <kbd>P</kbd>/<kbd>Esc</kbd> pausa &middot;
  <kbd>H</kbd>/<kbd>F1</kbd> hitboxes &middot;
  <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> FPS &middot;
  Haz clic en el juego para capturar el teclado
</div>

<script>
  var canvas = document.getElementById('canvas');
  var statusElement = document.getElementById('status');

  function setStatus(text) {
    if (!text) { statusElement.hidden = true; return; }
    statusElement.hidden = false;
    statusElement.innerHTML = text;
  }

  var Module = {
    canvas: canvas,
    print: function (text) { console.log(text); },
    printErr: function (text) { console.error(text); },
    setStatus: setStatus,
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      setStatus(left ? 'Cargando&hellip; (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
    },
    onRuntimeInitialized: function () {
      setStatus('');
      canvas.focus();
    }
  };

  canvas.addEventListener('click', function () { canvas.focus(); });

  // Evita scroll/zoom del navegador en movil.
  ['touchstart', 'touchmove', 'touchend', 'gesturestart'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });

  // ---------- Teclas sinteticas que SDL2 (emscripten) entiende ----------
  var TECLAS = {
    w:     { key: 'w', code: 'KeyW',  kc: 87 },
    a:     { key: 'a', code: 'KeyA',  kc: 65 },
    s:     { key: 's', code: 'KeyS',  kc: 83 },
    d:     { key: 'd', code: 'KeyD',  kc: 68 },
    space: { key: ' ', code: 'Space', kc: 32 }
  };

  function enviarEvento(tipo, key, code, keyCode) {
    var ev = new KeyboardEvent(tipo, { key: key, code: code, bubbles: true, cancelable: true });
    Object.defineProperty(ev, 'keyCode', { get: function () { return keyCode; } });
    Object.defineProperty(ev, 'which', { get: function () { return keyCode; } });
    window.dispatchEvent(ev);
  }

  var presionadas = {};
  function setTecla(nombre, on) {
    if (!!presionadas[nombre] === on) return;   // solo enviar cuando cambia
    presionadas[nombre] = on;
    var t = TECLAS[nombre];
    enviarEvento(on ? 'keydown' : 'keyup', t.key, t.code, t.kc);
  }

  var ultimoSalto = 0;
  function saltar() {
    var ahora = Date.now();
    if (ahora - ultimoSalto < 450) return;
    ultimoSalto = ahora;
    var t = TECLAS.space;
    enviarEvento('keydown', t.key, t.code, t.kc);
    setTimeout(function () { enviarEvento('keyup', t.key, t.code, t.kc); }, 80);
  }

  // ---------- Pantalla completa + horizontal (si el navegador lo permite) ----------
  var intentoFullscreen = false;
  function intentarHorizontal() {
    if (intentoFullscreen) return;
    intentoFullscreen = true;
    try {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        var p = req.call(el);
        var bloquear = function () {
          try {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function () {});
            }
          } catch (e) {}
        };
        if (p && p.then) { p.then(bloquear).catch(function () {}); } else { bloquear(); }
      }
    } catch (e) {}
  }
  document.getElementById('touch').addEventListener('pointerdown', intentarHorizontal, true);

  // ---------- Mandos flotantes (uno por mitad de pantalla) ----------
  // eje 'y' -> W/S   |   eje 'x' -> A/D
  // Un deslizamiento rapido hacia arriba con cualquiera de los dos dedos = salto.
  function crearMando(idZona, eje) {
    var zona = document.getElementById(idZona);
    var base = zona.querySelector('.base');
    var knob = zona.querySelector('.knob');
    var pointerId = null;
    var ox = 0, oy = 0;
    var historial = [];
    var RADIO = 50;         // recorrido maximo del mando
    var UMBRAL = 0.3;       // fraccion del radio para activar la direccion
    var FLICK_DIST = 70;    // px hacia arriba...
    var FLICK_MS = 170;     // ...dentro de este tiempo = salto

    function soltarTeclas() {
      if (eje === 'y') { setTecla('w', false); setTecla('s', false); }
      else { setTecla('a', false); setTecla('d', false); }
    }

    function detectarSalto(e) {
      var ahora = performance.now();
      historial.push({ t: ahora, y: e.clientY });
      while (historial.length > 1 && ahora - historial[0].t > FLICK_MS) historial.shift();
      if (historial[0].y - e.clientY > FLICK_DIST) {
        historial = [{ t: ahora, y: e.clientY }];
        saltar();
      }
    }

    function actualizar(e) {
      var r = zona.getBoundingClientRect();
      var dx = (e.clientX - r.left) - ox;
      var dy = (e.clientY - r.top) - oy;
      var u = RADIO * UMBRAL;
      if (eje === 'y') {
        var ky = Math.max(-RADIO, Math.min(RADIO, dy));
        knob.style.transform = 'translate(0,' + ky + 'px)';
        setTecla('w', dy < -u);
        setTecla('s', dy > u);
      } else {
        var kx = Math.max(-RADIO, Math.min(RADIO, dx));
        knob.style.transform = 'translate(' + kx + 'px,0)';
        setTecla('a', dx < -u);
        setTecla('d', dx > u);
      }
    }

    zona.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (pointerId !== null) return;
      pointerId = e.pointerId;
      try { zona.setPointerCapture(e.pointerId); } catch (err) {}
      var r = zona.getBoundingClientRect();
      var m = RADIO + 8;
      ox = Math.max(m, Math.min(r.width - m, e.clientX - r.left));
      oy = Math.max(m, Math.min(r.height - m, e.clientY - r.top));
      base.style.left = ox + 'px';
      base.style.top = oy + 'px';
      knob.style.transform = 'translate(0,0)';
      zona.classList.add('activo');
      historial = [{ t: performance.now(), y: e.clientY }];
      canvas.focus();
    });

    zona.addEventListener('pointermove', function (e) {
      if (e.pointerId !== pointerId) return;
      e.preventDefault();
      actualizar(e);
      detectarSalto(e);
    });

    function terminar(e) {
      if (e.pointerId !== pointerId) return;
      e.preventDefault();
      pointerId = null;
      historial = [];
      zona.classList.remove('activo');
      soltarTeclas();
    }
    zona.addEventListener('pointerup', terminar);
    zona.addEventListener('pointercancel', terminar);
    zona.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  crearMando('zona-izq', 'y');   // avanzar / retroceder
  crearMando('zona-der', 'x');   // apuntar / girar

  // ---------- Botones OK / Pausa ----------
  Array.prototype.forEach.call(document.querySelectorAll('#touch .tbtn[data-key]'), function (btn) {
    var activo = false;
    var keyCode = parseInt(btn.getAttribute('data-keycode'), 10) || 0;
    function enviar(tipo) {
      enviarEvento(tipo, btn.getAttribute('data-key'), btn.getAttribute('data-code'), keyCode);
    }
    function down(e) {
      e.preventDefault();
      e.stopPropagation();
      if (activo) return;
      activo = true;
      btn.classList.add('activo');
      if (btn.setPointerCapture && e.pointerId !== undefined) {
        try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      }
      enviar('keydown');
      canvas.focus();
    }
    function up(e) {
      e.preventDefault();
      if (!activo) return;
      activo = false;
      btn.classList.remove('activo');
      enviar('keyup');
    }
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
    btn.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  window.addEventListener('error', function () {
    setStatus('No se pudo iniciar el juego. Revisa la consola (F12).');
  });

  setStatus('Cargando juego&hellip;');
</script>

</body>
</html>
