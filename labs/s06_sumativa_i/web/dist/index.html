<!doctypehtml><html lang=es><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,user-scalable=no"name=viewport><meta content="Evaluacion Sumativa I - jugable en el navegador con WebAssembly."name=description><title>Evaluacion Sumativa I</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body,html{margin:0;padding:0;height:100%}body{background:#0c1c10;color:#e8f5e9;font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;gap:14px;padding:16px}h1{font-size:1.25rem;margin:0;font-weight:600;letter-spacing:.02em}#app{position:relative;line-height:0}canvas#canvas{background:#0c1c10;border:2px solid #2e5d3a;border-radius:6px;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;height:auto;outline:0;touch-action:none}#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(12,28,16,.85);font-size:1rem;border-radius:6px;line-height:1.4;text-align:center;padding:12px}#status[hidden]{display:none}#controles{font-size:.85rem;color:#a8c5ad;text-align:center;max-width:960px;line-height:1.5}#controles kbd{background:#1e3a26;border:1px solid #2e5d3a;border-radius:4px;padding:1px 6px;font-family:inherit;color:#e8f5e9}</style></head><body><h1>Evaluación Sumativa I</h1><div id=app><canvas aria-label="Area de juego"height=600 id=canvas oncontextmenu=event.preventDefault() tabindex=0 width=960></canvas><div id=status>Cargando juego…</div></div><div id=controles><kbd>W</kbd>/<kbd>S</kbd> avanzar/retroceder · <kbd>A</kbd>/<kbd>D</kbd> girar · <kbd>Espacio</kbd> saltar · <kbd>Enter</kbd>/<kbd>Espacio</kbd> menú · <kbd>P</kbd>/<kbd>Esc</kbd> pausa · <kbd>H</kbd>/<kbd>F1</kbd> hitboxes · <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> FPS · Haz clic en el juego para capturar el teclado</div><script>var canvas=document.getElementById("canvas"),statusElement=document.getElementById("status");function setStatus(t){t?(statusElement.hidden=!1,statusElement.innerHTML=t):statusElement.hidden=!0}var Module={canvas:canvas,print:function(t){console.log(t)},printErr:function(t){console.error(t)},setStatus:setStatus,totalDependencies:0,monitorRunDependencies:function(t){this.totalDependencies=Math.max(this.totalDependencies,t),setStatus(t?"Cargando&hellip; ("+(this.totalDependencies-t)+"/"+this.totalDependencies+")":"")},onRuntimeInitialized:function(){setStatus(""),canvas.focus()}};canvas.addEventListener("click",function(){canvas.focus()}),window.addEventListener("error",function(){setStatus("No se pudo iniciar el juego. Revisa la consola (F12).")}),setStatus("Cargando juego&hellip;")</script><script async src=index.js></script></body></html>
